[pytest]
# Without this, pytest's default collection (test_*.py *_test.py, scanned
# from the repo root) matches notebooks/smoke_test.py -- a real test file
# name collision, not a test. Importing it executes dbutils.library.
# restartPython() at module level, which only exists inside a Databricks
# notebook, so collection fails outside one. Nothing outside tests/ should
# ever be collected as a test.
testpaths = tests
